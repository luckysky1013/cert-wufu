<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a3d7a">
<title>特种设备作业人员证 · 公示核验</title>
<style>
  :root{
    --gov:#0a3d7a; --gov2:#1173e6; --bg:#eef2f7; --card:#fff; --ink:#18222e;
    --muted:#6a7686; --ok:#0c8a4f; --okbg:#e7f6ee; --line:#e4eaf1; --warn:#a15c07;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:
      radial-gradient(1200px 500px at 50% -10%, #dbe9ff 0%, transparent 60%),var(--bg);
    color:var(--ink);-webkit-font-smoothing:antialiased}
  .hd{position:relative;background:linear-gradient(120deg,#082f60,#0b57b0 60%,#1173e6);color:#fff;
    padding:26px 20px 8px}
  .hd .gov{font-size:12px;letter-spacing:.4em;opacity:.78}
  .hd h1{font-size:19px;font-weight:800;margin-top:10px;letter-spacing:.5px}
  .hd .seal{position:absolute;right:18px;top:22px;width:58px;height:58px;border-radius:50%;
    border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;
    font-size:9.5px;line-height:1.4;text-align:center;color:#fff;opacity:.9;letter-spacing:1px}
  .hd .seal b{font-size:14px}
  .wrap{max-width:780px;margin:0 auto;padding:0 14px 46px}
  .hero{position:relative;margin:18px 0 0;background:linear-gradient(135deg,#fff,#f4f8fe);
    border-radius:18px;box-shadow:0 10px 34px rgba(18,60,110,.12);padding:20px 18px 16px;
    display:flex;align-items:center;gap:16px;border:1px solid #eef2f8}
  .hero .av{width:66px;height:66px;border-radius:50%;flex:0 0 auto;background:linear-gradient(135deg,#0a4d92,#0f7bd6);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:800;
    box-shadow:0 6px 16px rgba(10,77,146,.32)}
  .hero .who{flex:1;min-width:0}
  .hero .nm{font-size:22px;font-weight:800;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .sex{font-size:13px;color:#0a4d92;background:#e6f0ff;padding:2px 11px;border-radius:20px;font-weight:600}
  .hero .uid{font-size:13px;color:var(--muted);margin-top:6px;letter-spacing:.4px}
  .badge{display:inline-flex;align-items:center;gap:7px;margin-top:9px;font-size:12.5px;color:var(--ok);
    background:var(--okbg);padding:4px 12px;border-radius:20px;font-weight:600}
  .badge .i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
  .sheet{background:var(--card);border-radius:18px;box-shadow:0 8px 28px rgba(18,60,110,.09);
    overflow:hidden;margin-top:16px;border:1px solid #eef2f8}
  .sheet .tt{display:flex;align-items:center;gap:9px;padding:15px 18px 12px;font-weight:800;font-size:15px;
    color:var(--gov)}
  .sheet .tt::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(#0a4d92,#0f7bd6)}
  table{width:100%;border-collapse:collapse;font-size:14.5px}
  tr{border-bottom:1px solid var(--line)}
  tr:last-child{border-bottom:none}
  td{padding:12px 18px;vertical-align:middle}
  td.k{width:122px;color:var(--muted);background:#f7fafc;font-size:13.5px;font-weight:600;letter-spacing:.5px}
  td.v{font-weight:600}
  .hint{font-size:12px;color:var(--muted);padding:10px 18px 0}
  .qrs{display:flex;align-items:center;gap:16px;margin-top:18px;background:#0a2f5d;
    border-radius:18px;padding:16px;color:#fff}
  .qrs img{width:120px;height:120px;flex:0 0 auto;background:#fff;padding:6px;border-radius:10px}
  .qrs .dl h3{font-size:15px;font-weight:700}
  .qrs .dl p{font-size:12px;opacity:.8;margin-top:6px;line-height:1.6;word-break:break-all}
  .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:18px;line-height:1.9}
  .foot b{color:#0a4d92}
</style>
</head>
<body>

<div class="hd">
  <div class="seal">证 件<br><b>核验</b><br>标识</div>
  <div class="gov">全国特种设备公示信息查询平台</div>
  <h1>特种设备作业人员证 · 扫码核验</h1>
</div>

<div class="wrap">

  <div class="hero">
    <div class="av" id="initAv">伍</div>
    <div class="who">
      <div class="nm" id="pName">伍金福 <span class="sex" id="pSex">男</span></div>
      <div class="uid">证书编号　<span id="pNo">612425198808191454</span></div>
      <div class="badge"><span class="i"></span>公示档案有效 · 本码已核验</div>
    </div>
  </div>

  <div class="sheet">
    <div class="tt">人员资质档案</div>
    <table>
      <tr><td class="k">身份证号</td><td class="v" id="f_sfzh"></td></tr>
      <tr><td class="k">姓名</td><td class="v" id="f_name"></td></tr>
      <tr><td class="k">性别</td><td class="v" id="f_sex"></td></tr>
      <tr><td class="k">证书类别</td><td class="v" id="f_zslb"></td></tr>
      <tr><td class="k">证书编号</td><td class="v" id="f_zsbh"></td></tr>
      <tr><td class="k">发证机关</td><td class="v" id="f_fzjg"></td></tr>
      <tr><td class="k">发证机关所在地</td><td class="v" id="f_fzjgSzd"></td></tr>
      <tr><td class="k">从业种类</td><td class="v" id="f_cyzl"></td></tr>
      <tr><td class="k">考核单位</td><td class="v" id="f_khdw"></td></tr>
      <tr><td class="k">考核日期</td><td class="v" id="f_khrq"></td></tr>
      <tr><td class="k">持证项目</td><td class="v" id="f_czxm"></td></tr>
      <tr><td class="k">批准日期</td><td class="v" id="f_pzrq"></td></tr>
      <tr><td class="k">批准单位</td><td class="v" id="f_pzdw"></td></tr>
      <tr><td class="k">有效日期</td><td class="v" id="f_yxrq"></td></tr>
      <tr><td class="k">备注</td><td class="v" id="f_remark"></td></tr>
    </table>
    <div class="hint" id="extraHint"></div>
  </div>

  <div class="qrs">
    <img id="qrImg" alt="本页二维码">
    <div class="dl">
      <h3>扫码核验本证书</h3>
      <p id="pageUrl">——</p>
    </div>
  </div>

  <div class="foot">
    数据来源：<b>cnse.e-cqs.cn</b> 全国特种设备公示信息查询平台存档公示记录<br>
    本页面为证书真伪扫码核验使用，仅收录公示期档案字段，详细以官网原文为准
  </div>

</div>

<script>
/* =========================================================================
   证件档案数据对象 —— 换人只改这一个对象即可
   ========================================================================= */
const CERT = {
  avatar: "伍",
  name:   "伍金福",
  sex:    "男",
  sfzh:   "612425198808191454",
  zslb:   "特种设备作业人员",
  zsbh:   "612425198808191454",
  fzjg:   "西安市市场监督管理局",
  fzjgSzd:"陕西",
  cyzl:   "作业人员",
  khdw:   "陕西省特种设备检验检测协会",
  khrq:   "2026-06-13",
  czxm:   "起重机指挥",
  pzrq:   "2026-06-16",
  pzdw:   "西安市市场监督管理局",
  yxrq:   "至 2030-06-12",
  remark: "——"
};

/* ----- 渲染 ----- */
function $(id){return document.getElementById(id);}
function fill(){const c=CERT;
  $("initAv").textContent=c.avatar||c.name.charAt(0);
  $("pName").innerHTML=c.name+' <span class="sex" id="pSex">'+c.sex+'</span>';
  $("pNo").textContent=c.zsbh;
  $("f_sfzh").textContent=c.sfzh;    $("f_name").textContent=c.name;
  $("f_sex").textContent=c.sex;      $("f_zslb").textContent=c.zslb;
  $("f_zsbh").textContent=c.zsbh;    $("f_fzjg").textContent=c.fzjg;
  $("f_fzjgSzd").textContent=c.fzjgSzd; $("f_cyzl").textContent=c.cyzl;
  $("f_khdw").textContent=c.khdw;    $("f_khrq").textContent=c.khrq;
  $("f_czxm").textContent=c.czxm;    $("f_pzrq").textContent=c.pzrq;
  $("f_pzdw").textContent=c.pzdw;    $("f_yxrq").textContent=c.yxrq;
  $("f_remark").textContent=c.remark;
}
function qr(){
  const url=location.href;
  $("pageUrl").textContent=url;
  // 优先使用随库托管的本地二维码；访问域名非正式域名时实时生成兜底
  if (location.hostname.indexOf("github.io")>=0 || location.hostname.indexOf("cert")>=0) {
    $("qrImg").src="qr.png";
  } else {
    $("qrImg").src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data="+encodeURIComponent(url);
  }
}
fill();qr();
</script>
</body>
</html>
